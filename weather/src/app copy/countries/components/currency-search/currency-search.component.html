<section class="p-4">
  <form #ngForm (ngSubmit)="submit()">
    <div class="bg-gray-200 p-2 rounded-lg">
      <input
        class="bg-white p-2 mr-3 rounded-lg"
        type="text"
        [(ngModel)]="searchTerm"
        name="searchTerm"
      />
      <button class="bg-gray-300 rounded-lg p-2 px-4" type="submit" ngSubmit>
        Search
      </button>
    </div>
  </form>
</section>
